# ============================================================
# Server
# ============================================================
server.port=8081

# ============================================================
# DataSource - MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_queue?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# JWT
# ============================================================
app.jwt.secret=7A25432A462D4A614E645267556B58703272357538782F413F4428472B4B6250
app.jwt.expiration-ms=86400000

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:4200

# ============================================================
# Logging
# ============================================================
logging.level.com.hospital.queue=INFO
logging.level.org.springframework.security=WARN
