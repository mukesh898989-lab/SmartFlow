# ============================================================
#  SmartFlowApp — Selenium Test Data
# ============================================================
#  Base values for test entities. The test class appends a
#  timestamp (System.currentTimeMillis()) to names, emails and
#  phone numbers so each run produces unique values and the
#  backend never throws "duplicate entry" errors.
# ============================================================

# ---- Application URL ----
app.base.url=http://localhost:4200

# ---- Default Admin (seeded by DataInitializer.java) ----
admin.email=admin@hospital.com
admin.password=Admin@123

# ---- Department ----
# dept.suffix is appended after the 4-letter unique prefix generated from the timestamp
dept.suffix=Dept
dept.description=Cancer and oncology treatment

# ---- Doctor ----
doctor.name=Dr. Smith
doctor.email.prefix=dr.smith
doctor.email.domain=@hospital.com
doctor.password=Doctor@123
doctor.specialization=Oncologist

# ---- Receptionist ----
receptionist.name=Mary
receptionist.email.prefix=mary
receptionist.email.domain=@hospital.com
receptionist.password=Recept@123

# ---- Patient ----
patient.name=Ravi
patient.phone.prefix=98765
patient.email=ravi@gmail.com
patient.age=35
patient.gender=Male
